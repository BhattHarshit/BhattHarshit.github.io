name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - hugo-source # Trigger on pushes to the hugo-source branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.125.7' # Check Hugo's latest version (or specific version you use)
      NODE_VERSION: '20'     # Use Node.js 20 for TailwindCSS build
    steps:
      - name: Checkout your Hugo source code
        uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (if you use git submodules)
          fetch-depth: 0   # Fetch all history for auto-merge conflicts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (for TailwindCSS)
        run: npm install # Adjust if you use yarn or pnpm, or remove if not using npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true # Essential for TailwindCSS and PostCSS processing

      - name: Build Hugo site
        run: hugo --minify --baseURL "https://BhattHarshit.github.io/" # IMPORTANT: Set your exact base URL here!

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # Path to your built Hugo site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4