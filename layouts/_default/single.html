{{ define "main" }}
<h1 class="text-3xl font-bold mb-6 text-gray-900 dark:text-gray-100">{{ .Title }}</h1>

{{ if and (.Parent) (ne .Parent.RelPermalink "/") }}
  <a href="{{ .Parent.RelPermalink }}" class="inline-flex items-center text-indigo-600 dark:text-indigo-400 hover:underline mb-6">
    <i class="fas fa-arrow-left mr-2"></i> Back to {{ .Parent.Title }}
  </a>
{{ end }}

<div class="content prose dark:prose-invert max-w-none">
    {{ .Content }}
</div>
{{ end }}
