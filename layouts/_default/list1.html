{{ define "main" }}
<section class="max-w-5xl mx-auto px-6 py-5 space-y-8">

  <h1 class="text-4xl font-bold text-gray-900 dark:text-gray-100 mb-6">{{ .Title }}</h1>

  {{ if .Content }}
    <div class="prose dark:prose-invert max-w-none mb-8 text-lg text-gray-700 dark:text-gray-300 research-links">
      {{ .Content }}
    </div>
  {{ end }}

  {{ if .Pages }}
    <div class="space-y-8">
      {{ range .Pages.ByWeight }}
        <article class="border border-gray-300 dark:border-gray-700 rounded-lg p-6 hover:shadow-lg transition duration-300">
          <h2 class="text-2xl font-semibold mb-4">
            <a href="{{ .Permalink }}" class="text-indigo-600 hover:underline dark:text-indigo-400">
              {{ .Title }}
            </a>
          </h2>

          <h2 class="prose dark:prose-invert max-w-none mb-4 research-links">
            {{ if .Truncated }}
              {{ .Summary | safeHTML }}
            {{ else }}
              {{ .Content }}
            {{ end }}
          </h2>

          <a href="{{ .Permalink }}" class="inline-flex items-center text-indigo-600 dark:text-indigo-400 hover:underline">
            Read more →
          </a>
        </article>
      {{ end }}
    </div>
  {{ else }}
    <!-- <p class="text-gray-500 dark:text-gray-400">No items available at this time.</p> -->
  {{ end }}

</section>

<style>
  /* Custom link style for research section */
  .research-links a {
    color: #111827; /* Tailwind gray-900 */
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .research-links a:hover {
    color:  #111827; /*#4F46E5; /* Tailwind indigo-600 */
    text-decoration: underline;
  }
</style>

{{ end }}
